# Nginx reverse proxy for staging (and the template for production).
# TLS termination, HTTP -> HTTPS, strict Host routing (M03):
#   console.<root>        Platform Console SPA + /api/v1/auth, /api/v1/platform
#   app.<root>            Business CRM SPA     + /api/v1/auth, /api/v1/business
#   api.<root>            API only             + /api/v1/auth, /api/v1/business, /api/v1/platform
#   <slug>.book.<root>    Booking Web SPA      + /api/v1/public (same origin, no CORS)
#   anything else         404, never served as an existing company
# The API enforces the same host -> API group policy (host_policy.py), nginx is the first gate.

upstream api_upstream {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ========================================================
# HTTP (80): health probe, everything else -> HTTPS
# ========================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================================
# 1. Platform Console
# ========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name console.staging.crm.internal;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/platform-console;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';" always;

    location ~ ^/api/v1/(auth|platform)/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"code":"ROUTE_NOT_AVAILABLE_ON_HOST"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
