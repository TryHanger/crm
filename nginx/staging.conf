# ========================================================
# 3. Public API host (integrations, future mobile apps)
# ========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.staging.crm.internal;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/(api/v1/(auth|business|platform)/|health/) {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND"}';
    }
}

# ========================================================
# 4. Booking Web: <slug>.book.<root>, slug = one DNS label
# ========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # quoted: braces in the regex would otherwise end the directive
    server_name "~^(?<tenant_subdomain>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.book\.staging\.crm\.internal$";

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/booking-web;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # same-origin public API; which company is decided by the API from the Host (tenant_domains)
    location /api/v1/public/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"code":"ROUTE_NOT_AVAILABLE_ON_HOST"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
# 5. Default: unmapped hosts on HTTPS
# ========================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        default_type text/plain;
        return 404 "Domain not mapped to SaaS CRM platform\n";
    }
}
