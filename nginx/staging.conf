# Nginx Reverse Proxy Configuration for Staging & Production
# Enforces Host routing, TLS termination, API forwarding, and security headers

upstream api_upstream {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Platform Console (console.<DOMAIN>)
server {
    listen 80;
    listen [::]:80;
    server_name ~^console\..+$;

    root /var/www/platform-console;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http: https:;" always;

    # API Proxy
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Business CRM (app.<DOMAIN>)
