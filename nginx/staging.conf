# Nginx Reverse Proxy Configuration for Staging & Production
# Enforces Host routing, TLS termination, HTTPS redirection, and secure proxy headers.

upstream api_upstream {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ========================================================
# HTTP (Port 80) -> Automatic Redirect to HTTPS (Port 443)
# ========================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check probe remains available over plain HTTP for load balancers
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================================
# 1. Platform Console (console.staging.crm.internal / console.localhost)
# ========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name console.staging.crm.internal console.localhost;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/platform-console;
    index index.html;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http: https:;" always;

    # API Proxy with anti-spoofing header control
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

