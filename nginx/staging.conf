# ========================================================
# 3. Booking Web (<tenant>.book.staging.crm.internal / <tenant>.localhost)
# ========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?<tenant_subdomain>[a-zA-Z0-9_-]+)\.book\.staging\.crm\.internal$
                ~^(?<tenant_subdomain>[a-zA-Z0-9_-]+)\.book\.localhost$
                ~^(?<tenant_subdomain>[a-zA-Z0-9_-]+)\.localhost$;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/booking-web;
    index index.html;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Proxy with anti-spoofing header control
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
# 4. Default / Fallback for unmapped domains on HTTPS
# ========================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        default_type text/plain;
        return 404 "Domain not mapped to SaaS CRM platform\n";
    }
}
