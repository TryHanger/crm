services:
  postgres:
    image: postgres:17-alpine
    container_name: saas_crm_staging_pg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-saas_crm_staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    networks:
      staging_net:
        ipv4_address: 172.28.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-saas_crm_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_crm_staging_migrations
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging_net
    environment:
      PROCESS_ROLE: migration
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saas_crm_staging}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-crm_app_user}:${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}@postgres:5432/${POSTGRES_DB:-saas_crm_staging}
      DB_USER: ${DB_USER:-crm_app_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
      ADMIN_DB_USER: ${POSTGRES_USER}
      ADMIN_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENVIRONMENT: staging
      ENABLE_DEMO_SEED: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env.staging}
      INITIAL_PLATFORM_OWNER_EMAIL: ${INITIAL_PLATFORM_OWNER_EMAIL:-admin@staging.crm.internal}
      INITIAL_PLATFORM_OWNER_PASSWORD: ${INITIAL_PLATFORM_OWNER_PASSWORD:?INITIAL_PLATFORM_OWNER_PASSWORD must be set in .env.staging}
      INITIAL_PLATFORM_OWNER_NAME: ${INITIAL_PLATFORM_OWNER_NAME:-Platform Administrator}
      PLATFORM_IP_ALLOWLIST: ${PLATFORM_IP_ALLOWLIST:?PLATFORM_IP_ALLOWLIST must be set in .env.staging}
    command: >
      sh -c "alembic upgrade head &&
             python -m apps.api.app.infrastructure.db.init_db"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_crm_staging_api
    restart: always
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      staging_net:
        ipv4_address: 172.28.0.20
    environment:
      PROCESS_ROLE: api
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-crm_app_user}:${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}@postgres:5432/${POSTGRES_DB:-saas_crm_staging}
      DB_USER: ${DB_USER:-crm_app_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
      ENVIRONMENT: staging
      ENABLE_DEMO_SEED: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env.staging}
      PLATFORM_IP_ALLOWLIST: ${PLATFORM_IP_ALLOWLIST:?PLATFORM_IP_ALLOWLIST must be set in .env.staging}
      TRUSTED_PROXIES: 127.0.0.1,::1,proxy,nginx,172.28.0.10
      BOOKING_DOMAIN_SUFFIX: ${BOOKING_DOMAIN_SUFFIX:-.book.staging.crm.internal}
      CRM_DOMAIN: ${CRM_DOMAIN:-app.staging.crm.internal}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-console.staging.crm.internal}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@staging.crm.internal}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: saas_crm_staging_frontend
    restart: always
    networks:
      - staging_net
    volumes:
      - frontend_booking:/var/www/booking-web
      - frontend_crm:/var/www/business-crm
      - frontend_platform:/var/www/platform-console

  proxy:
    image: nginx:1.27-alpine
    container_name: saas_crm_staging_proxy
    restart: always
    depends_on:
      - api
      - frontend
    networks:
      staging_net:
        ipv4_address: 172.28.0.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend_booking:/var/www/booking-web:ro
      - frontend_crm:/var/www/business-crm:ro
      - frontend_platform:/var/www/platform-console:ro

networks:
  staging_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  staging_pgdata:
  frontend_booking:
  frontend_crm:
  frontend_platform:
