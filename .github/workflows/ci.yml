name: CI / Automated Tests & Gate Verification

on:
  push:
    branches: [ "main", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main", "feat/*", "fix/*" ]

jobs:
  test:
    name: Full CI Suite (PostgreSQL 17, Pytest 48 Tests, Staging Container Deployment, Playwright E2E)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: saas_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # M15: SMTP sink for the notification smoke
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install PostgreSQL 17 Client & System Dependencies
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          psql --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PostgreSQL Connection and Extensions
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -p 5432 -U postgres -d saas_crm_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          psql -h localhost -p 5432 -U postgres -d saas_crm_test -c "SELECT current_database(), current_user, version();"

      - name: Run Alembic Migrations
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saas_crm_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/saas_crm_test
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: saas_crm_test
          ADMIN_DB_USER: postgres
          ADMIN_DB_PASSWORD: postgrespassword
        run: |
          alembic upgrade head
          # models and migration head must match: a model change needs its own revision
          alembic check

      - name: Run Pytest Test Suite (Non-Superuser Runtime Role)
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saas_crm_test
          DATABASE_URL: postgresql+asyncpg://crm_app_user:crm_app_secret@localhost:5432/saas_crm_test
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: saas_crm_test
          ADMIN_DB_USER: postgres
          ADMIN_DB_PASSWORD: postgrespassword
          DB_USER: crm_app_user
          DB_PASSWORD: crm_app_secret
          ENABLE_DEMO_SEED: "true"
          JWT_SECRET_KEY: test-jwt-secret-key-32-chars-long-minimum-length!
        run: |
          python -m pytest apps/api/tests/ -v --durations=10

      - name: Verify Real Containerized Staging Deployment (Docker Compose + Nginx TLS Smoke Probes)
        run: |
          python scripts/verify_staging_deployment.py --report staging_deployment_report.json --teardown
          cat staging_deployment_report.json

      - name: Upload Staging Deployment Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-report
          path: staging_deployment_report.json
          retention-days: 7

      - name: Verify PostgreSQL Backup & Restore DR Pipeline
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saas_crm_test
          ADMIN_DB_USER: postgres
          ADMIN_DB_PASSWORD: postgrespassword
          DB_USER: crm_app_user
          DB_PASSWORD: crm_app_secret
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: saas_crm_test
        run: |
          python scripts/backup_db.py --output-dir backups --database saas_crm_test --verbose
          python scripts/restore_db.py --target-db saas_crm_ci_restore_test --report backups/ci_restore_report.json --verbose
          cat backups/ci_restore_report.json

      - name: Verify AES-256 Encrypted Offsite Disaster Recovery Pipeline
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saas_crm_test
          ADMIN_DB_USER: postgres
          ADMIN_DB_PASSWORD: postgrespassword
          DB_USER: crm_app_user
          DB_PASSWORD: crm_app_secret
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: saas_crm_test
        run: |
          python scripts/offsite_backup.py --test-negative
          export BACKUP_ENCRYPTION_KEY=$(python scripts/offsite_backup.py --generate-key)
          python scripts/offsite_backup.py --database saas_crm_test --verify --target-db saas_crm_ci_offsite_restore_test
          cat backups/offsite_dr_verification_report.json

      - name: Upload Disaster Recovery Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disaster-recovery-report
          path: |
            backups/ci_restore_report.json
            backups/offsite_dr_verification_report.json
          retention-days: 7

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Build Frontend Workspaces (TypeScript & Vite)
        run: |
          npm run build --workspaces

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (with API and Frontend Services)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/saas_crm_test
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saas_crm_test
          ENVIRONMENT: development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: saas_crm_test
          ADMIN_DB_USER: postgres
          ADMIN_DB_PASSWORD: postgrespassword
          ENABLE_DEMO_SEED: "true"
          JWT_SECRET_KEY: test-jwt-secret-key-32-chars-long-minimum-length!
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          SMTP_SECURITY: none
          SMTP_FROM: noreply@crm.localhost
          PUBLIC_BOOKING_URL_TEMPLATE: http://{slug}.localhost:3000
        run: |
          sudo sed -i 's/127.0.0.1 localhost/127.0.0.1 localhost barberhouse.localhost moderncut.localhost/' /etc/hosts
          python -c "from apps.api.app.infrastructure.db.init_db import init_database, seed_database; init_database(); seed_database()"
          uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8000 &
          python scripts/outbox_worker.py --interval 1 &
          npm run dev --workspace=@crm/booking-web -- --port 3000 --host 0.0.0.0 &
          npm run dev --workspace=@crm/business-crm -- --port 3001 --host 0.0.0.0 &
          npm run dev --workspace=@crm/platform-console -- --port 3002 --host 0.0.0.0 &
          for port in 8000 3000 3001 3002; do
            for i in {1..30}; do
              if curl -s "http://127.0.0.1:$port" > /dev/null 2>&1; then
                echo "Port $port ready!"
                break
              fi
              echo "Waiting for port $port ($i/30)..."
              sleep 1
            done
          done
          curl -s http://127.0.0.1:8000/api/v1/public/site -H "Host: barberhouse.book.example.kz"
          # M01 smoke: public booking for tenant A through Booking Web origin, CRM A sees it, tenant B isolated
          python scripts/smoke_two_tenants.py
          # M02 smoke: operator creates company, owner accepts the invite once and logs in
          python scripts/smoke_onboarding.py
          # M04 smoke: 8000 KZT service created in CRM is visible in its branch on the booking site
          python scripts/smoke_pricing.py
          # M05 smoke: two masters with different shifts and prices show their own hours on the booking site
          python scripts/smoke_schedules.py
          # M06 smoke: service-first, master-first and time-first each end with a real booking
          python scripts/smoke_booking_flows.py
          # M07 smoke: 20 concurrent clients on one slot -> one booking, others get new slots
          python scripts/smoke_slot_race.py
          # M08 smoke: CRM block 13-14 closes the time on the booking site, calendar free windows match
          python scripts/smoke_calendar_block.py
          # M09 smoke: reschedule frees the old slot and logs the event, cancel keeps history
          python scripts/smoke_visit_lifecycle.py
          # M10 smoke: repeat visit finds its client, a shared phone does not merge people, other companies see nothing
          python scripts/smoke_customers.py
          # M11 smoke: completing an 8000 KZT visit -> rendered 8000, paid 0, debt 8000
          python scripts/smoke_accrual.py
          # M12 smoke: 3000 of 8000 paid -> debt 5000, cash account reconciles, replay does not double
          python scripts/smoke_cash.py
          # M13 smoke: partial payment, refund 1000 and advance 2000 reconciled by the cash shift
          python scripts/smoke_shift.py
          # M14 smoke: finance report from the ledger, expense reconciled by the shift
          python scripts/smoke_reports.py
          # M15 smoke: real SMTP delivery via Mailpit, manage link opens, master does not see the till
          python scripts/smoke_notifications.py
          npx playwright test || (for f in test-results/**/error-context.md; do [ -f "$f" ] && cat "$f"; done; exit 1)

      - name: Upload Playwright Test Results & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            docs/screenshots/
            test-results/
          retention-days: 7
