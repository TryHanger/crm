name: CI / Automated Tests & Gate Verification

on:
  push:
    branches: [ "main", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main", "feat/*", "fix/*" ]

jobs:
  test:
    name: Backend Test Suite (PostgreSQL 17 + Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: saas_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PostgreSQL Connection and Extensions
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -p 5432 -U postgres -d saas_crm_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          psql -h localhost -p 5432 -U postgres -d saas_crm_test -c "SELECT current_database(), current_user, version();"

      - name: Run Alembic Migrations
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saas_crm_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/saas_crm_test
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: saas_crm_test
          ADMIN_DB_USER: postgres
          ADMIN_DB_PASSWORD: postgrespassword
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saas_crm_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/saas_crm_test
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: saas_crm_test
          ADMIN_DB_USER: postgres
          ADMIN_DB_PASSWORD: postgrespassword
          ENABLE_DEMO_SEED: "true"
          JWT_SECRET_KEY: test-jwt-secret-key-32-chars-long-minimum-length!
        run: |
          python -m pytest apps/api/tests/ -v --durations=10
