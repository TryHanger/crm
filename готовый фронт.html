<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Онлайн-запись, лист сценариев</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: toolbar with presets and fine controls above a live preview stage (desktop width or 390px phone) */
:root {
  --bg: #EEF1F5;
  --panel: #FFFFFF;
  --line: #D5DBE3;
  --fg: #0F172A;
  --muted: #526071;
  --accent: #2563EB;
  --accent-fg: #FFFFFF;
  --chip: #F4F6F9;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141C; --panel: #161E29; --line: #2A3544; --fg: #E6ECF3; --muted: #93A1B3;
    --accent: #6EA0FF; --accent-fg: #0B1220; --chip: #1D2733; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141C; --panel: #161E29; --line: #2A3544; --fg: #E6ECF3; --muted: #93A1B3;
  --accent: #6EA0FF; --accent-fg: #0B1220; --chip: #1D2733; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.group > .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.fine { display: flex; flex-wrap: wrap; gap: 16px 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.chip { font: inherit; font-size: 14px; font-weight: 500; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--chip); color: var(--fg); cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip:focus-visible, .sw:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.stagebox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cap { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scroller { overflow-x: auto; border-radius: 8px; }
.stage { margin: 0 auto; box-shadow: 0 1px 4px rgba(15,23,42,.18); background: #F8FAFC; color: #0F172A; border-radius: 6px; overflow: hidden; }
.stage.desktop { width: 100%; max-width: 1280px; }
.stage.mobile { width: 390px; max-width: none; }
.stage button, .stage a { font-family: inherit; }
.stage button:focus-visible, .stage a:focus-visible { outline: 3px solid #93C5FD; outline-offset: 2px; }
.stage a.menu-link:hover { background: #F1F5F9; }
@keyframes sk-pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
.stage .sk { animation: sk-pulse 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .stage .sk { animation: none; } }
.wrap > section { display: flex; flex-direction: column; gap: 16px; }
.wrap > section[hidden] { display: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 16px; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.hint { margin: 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 470px), 1fr)); gap: 16px; }
.ocard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ocard h2 { margin: 0; font-size: 15px; font-weight: 600; }
.thumbs { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.thumb { font: inherit; padding: 0; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; color: var(--muted); font-size: 12px; text-align: left; }
.thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.tclip { position: relative; overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 1px var(--line), 0 1px 4px rgba(15,23,42,.15); background: #F8FAFC; }
.thumb:hover .tclip { box-shadow: 0 0 0 2px var(--accent); }
.tin { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; background: #F8FAFC; color: #0F172A; overflow: hidden; }
.detail { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.detail .dcol { flex: 1 1 640px; }
.detail .mcol { flex: 0 1 auto; max-width: 100%; }
.nav { align-items: center; }

.fsec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.fsec h2 { margin: 0; font-size: 16px; font-weight: 700; }
.flowrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.flowrow .fbox { flex: 1 1 200px; }
.arr { align-self: center; color: var(--muted); font-size: 18px; }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.fbox { background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 14px; }
.fbox b { font-size: 15px; }
.fbox .who { color: var(--muted); font-size: 13px; }
.bdg { align-self: flex-start; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.chains { display: flex; flex-direction: column; gap: 12px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; }
.cstep { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--chip); border: 1px solid var(--line); color: var(--muted); }
.cstep.done { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.cstep.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chainrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.chainrow:last-child { border-bottom: 0; padding-bottom: 0; }
.tablewrap { overflow-x: auto; }
.rules { border-collapse: collapse; min-width: 820px; width: 100%; font-size: 14px; }
.rules th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.rules td { vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); }
.rules tr:last-child td { border-bottom: 0; }
.rules td:first-child { font-weight: 600; }
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; margin: 0; }
.specs div { background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.specs dt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.specs dd { margin: 4px 0 0; font-size: 14px; }
.toolrow { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.toolrow .grow { flex: 1 1 0; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.chip:disabled { opacity: .5; cursor: not-allowed; }
.stand { display: flex; flex-direction: column; gap: 20px; }
.scn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.scn h2 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.pair { display: flex; flex-wrap: nowrap; gap: 24px; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
.blk { flex: none; display: flex; flex-direction: column; gap: 8px; }
.bh { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.bh .cap { flex: 1 1 100%; }
.bbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { font: inherit; font-size: 13px; font-weight: 600; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
.mini:hover:not(:disabled) { border-color: var(--muted); }
.mini:disabled { opacity: .5; cursor: not-allowed; }
.mini:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.frame { position: relative; overflow: hidden; background: #F8FAFC; box-shadow: 0 0 0 1px var(--line), 0 1px 4px rgba(15,23,42,.15); border-radius: 4px; cursor: pointer; }
.frame:hover { box-shadow: 0 0 0 2px var(--accent); }
.frame:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.stage.real { border-radius: 0; box-shadow: none; margin: 0; max-width: none; }
.stage.real.desktop { width: 1280px; min-height: 1000px; }
.stage.real.mobile { width: 390px; }
.scroller.big { overflow: auto; }
.exphost { position: absolute; left: 0; top: 0; }
body.exporting .wrap { display: none; }
.exp { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.exp[hidden] { display: none; }
.expcard { width: min(100%, 460px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.pbar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; border: 1px solid var(--line); }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); }
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 9000; max-width: min(92vw, 460px); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; }
.toast[hidden] { display: none; }
.stage main > * { flex-shrink: 0; }
.sel { font: inherit; font-size: 14px; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); max-width: 100%; }
.sel:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.group[hidden] { display: none; }
.sumline { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.vt { font-size: 15px; line-height: 1.3; display: block; }
.dm { display: flex; gap: 16px; align-items: flex-start; }
.sub1 { display: flex; flex-direction: column; gap: 8px; flex: none; }
.sub1 .bh .cap { flex: 1 1 100%; font-size: 12px; }

html, body { margin: 0; height: 100%; overflow: hidden; background: #E6E7EA; }
#cv { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background: #E6E7EA; background-image: radial-gradient(#C9CBD1 1px, transparent 1px); background-size: 24px 24px; }
#cv.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.rowt { position: absolute; font: 700 88px/1.2 Inter, system-ui, sans-serif; color: #111827; white-space: nowrap; }
.cell { position: absolute; }
.ct { position: absolute; font: 600 44px/1.3 Inter, system-ui, sans-serif; color: #374151; white-space: nowrap; }
.fr { position: absolute; background: #F8FAFC; box-shadow: 0 0 0 1px rgba(15,23,42,.12), 0 2px 12px rgba(15,23,42,.12); overflow: hidden; }
.fr .stage { margin: 0; }
.zoomui { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center; background: #fff; border: 1px solid #D1D5DB; border-radius: 10px; padding: 4px; font: 600 14px Inter, system-ui, sans-serif; color: #111827; z-index: 5; }
.zoomui button { font: inherit; min-width: 40px; min-height: 40px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; color: inherit; }
.zoomui button:hover { background: #F3F4F6; }
.zoomui button:focus-visible { outline: 3px solid #2563EB; outline-offset: 1px; }
.zoomui span { min-width: 48px; text-align: center; }
#flow { position: fixed; inset: 0; z-index: 100; background: #EEF0F3; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #111827; }
#flow[hidden] { display: none; }
.fbar { flex: none; background: #FFFFFF; border-bottom: 1px solid #D1D5DB; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.fbar b { font-size: 15px; }
.fbar label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; }
.fbar select { font: inherit; font-size: 14px; min-height: 36px; border: 1px solid #CBD5E1; border-radius: 8px; padding: 0 8px; background: #fff; color: #111827; }
.fbtn { font: inherit; font-size: 14px; font-weight: 600; min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #CBD5E1; background: #fff; color: #111827; cursor: pointer; }
.fbtn[aria-pressed="true"] { background: #111827; color: #fff; border-color: #111827; }
.fbtn:focus-visible, .fbar select:focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
#f-body { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
#f-wrap { margin: 0 auto; position: relative; }
#f-stage { transform-origin: 0 0; }
.openflow { font: 600 14px Inter, system-ui, sans-serif; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #2563EB; color: #fff; cursor: pointer; }
.ccw:focus-within{border-color:#2563EB!important;box-shadow:0 0 0 3px #2563EB33}
</style>

<div id="cv" aria-label="Холст со сценариями. Колесо мыши меняет масштаб, перетаскивание двигает лист."><div id="world"></div></div>
<div class="zoomui"><button type="button" class="openflow" id="openflow">Пройти путь записи</button><button type="button" id="zo" aria-label="Уменьшить">−</button><span id="zv">100%</span><button type="button" id="zi" aria-label="Увеличить">+</button><button type="button" id="zf">Вписать</button></div>
<div id="flow" hidden role="dialog" aria-label="Интерактивный путь записи"><div class="fbar" id="f-bar"></div><div id="f-body"><div id="f-wrap"><div id="f-stage" class="stage real desktop"></div></div></div></div>
<script type="text/x-template" id="tpl-desktop">
<div style="background: #F8FAFC; color: #0F172A; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">

  <!-- Лёгкая шапка -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <div style="max-width: 1040px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 48px; height: 48px; flex: none; border-radius: 12px; background: #0F172A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; letter-spacing: 0.04em">BH</div>
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 18px; line-height: 1.3; font-weight: 700; letter-spacing: 0.06em">BARBER HOUSE</span>
          <span style="display: flex; align-items: center; gap: 6px; color: #64748B; font-size: 14px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            {{ branch }}
          </span>
        </div>
      </div>
      <div style="position: relative">
        <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" style="height: 48px; padding: 0 18px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; border: 1px solid #CBD5E1; border-radius: 10px; background: #FFFFFF; color: #0F172A; font-size: 16px; font-weight: 500; cursor: pointer">
          Контакты
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; right: 0; top: 56px; z-index: 5; width: 240px; padding: 6px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 8px 24px rgba(15,23,42,0.12)">
            <a class="menu-link" href="#" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 16px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
              Построить маршрут
            </a>
            <a class="menu-link" href="#" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 16px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
              Позвонить
            </a>
          </div>
        </sc-if>
      </div>
    </div>
  </header>

  <main style="width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

    <!-- Шаги записи: порядок зависит от того, с чего начал клиент -->
    <nav aria-label="Шаги записи">
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 16px">
        <sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
          <li aria-current="{{ st.aria }}" style="display: flex; align-items: center; gap: 10px; color: {{st.labelColor}}">
            <span style="width: 30px; height: 30px; border-radius: 50%; background: {{st.bg}}; color: {{st.fg}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{ st.done }}" hint-placeholder-val="{{ false }}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
              <sc-if value="{{ st.pref }}" hint-placeholder-val="{{ false }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
              </sc-if>
              <sc-if value="{{ st.showNum }}" hint-placeholder-val="{{ true }}">{{ st.n }}</sc-if>
            </span>
            <span style="font-weight: {{st.weight}}">{{ st.label }}</span>
            <sc-if value="{{ st.notLast }}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="display: inline-block; width: 28px; height: 2px; margin-left: 2px; background: #E2E8F0"></span>
            </sc-if>
          </li>
        </sc-for>
      </ol>
    </nav>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

      <!-- Левая колонка -->
      <section style="flex: 999 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <a href="#" onClick="{{ back }}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: -8px; color: #475569; text-decoration: none; font-size: 15px; font-weight: 500">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          {{ backLabel }}
        </a>

        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: -12px">
          <h1 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700">{{ title }}</h1>
          <p style="margin: 0; color: #475569; font-size: 16px">{{ subtitle }}</p>
        </div>

        <!-- Время: предпочтение, проверенный интервал или подтверждение -->
        <sc-if value="{{ hasTimeBox }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E8F0">
            <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #F1F5F9; color: #0F172A; display: flex; align-items: center; justify-content: center">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; color: #475569">{{ tb.label }}</span>
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 18px; font-weight: 600">{{ tb.value }}</span><span style="padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{tb.badgeBg}}; color: {{tb.badgeFg}}">{{ tb.badge }}</span></span>
              <span style="font-size: 14px; color: #475569">{{ tb.note }}</span>
            </span>
            <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Изменить</a>
          </div>
        </sc-if>

        <sc-if value="{{ hasBanner }}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 14px; background: {{bn.bg}}; border: 1px solid {{bn.border}}; color: {{bn.fg}}">
            <span style="font-size: 16px; line-height: 1.3; font-weight: 700">{{ bn.title }}</span>
            <span style="font-size: 15px; line-height: 1.4">{{ bn.text }}</span>
            <sc-if value="{{ bn.hasChips }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{ bn.chips }}" as="ch" hint-placeholder-count="2">
                  <button type="button" onClick="{{ ch.pick }}" style="min-height: 44px; min-width: 72px; padding: 0 16px; border-radius: 10px; border: 1px solid {{bn.border}}; background: #FFFFFF; color: #0F172A; font-size: 16px; font-weight: 600; cursor: pointer">{{ ch.label }}</button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ bn.hasAction }}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{ bn.onAction }}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: {{bn.btnBg}}; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">{{ bn.action }}</button>
            </sc-if>
          </div>
        </sc-if>

        <!-- Загрузка: скелетоны вместо прыгающего интерфейса -->
        <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 12px" aria-busy="true">
            <p role="status" style="margin: 0; color: #475569; font-size: 14px">Загружаем мастеров…</p>
            <sc-for list="{{ skeletons }}" as="k" hint-placeholder-count="4">
              <div class="sk" aria-hidden="true" style="display: flex; align-items: center; gap: 16px; padding: 24px; min-height: 104px; box-sizing: border-box; border-radius: 16px; border: 1px solid #E2E8F0; background: #FFFFFF">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: #E2E8F0"></div>
                <div style="width: 56px; height: 56px; border-radius: 50%; background: #E2E8F0"></div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
                  <div style="width: 40%; height: 16px; border-radius: 6px; background: #E2E8F0"></div>
                  <div style="width: 25%; height: 12px; border-radius: 6px; background: #E2E8F0"></div>
                </div>
                <div style="width: 90px; height: 20px; border-radius: 6px; background: #E2E8F0"></div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        
        <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 24px; border-radius: 14px; background: #FFFFFF; border: 1px solid #FCA5A5">
            <span style="width: 44px; height: 44px; border-radius: 12px; background: #FEF2F2; color: #B91C1C; display: flex; align-items: center; justify-content: center">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l22 22"></path><path d="M16.7 11.1A11 11 0 0 1 21 13.5"></path><path d="M5 12.6a11 11 0 0 1 5.2-2.5"></path><path d="M8.5 16.4a6 6 0 0 1 7 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            </span>
            <h2 style="margin: 0; font-size: 20px; line-height: 1.3; font-weight: 700">{{ errTitle }}</h2>
            <p style="margin: 0; color: #475569; font-size: 15px">Проверьте соединение и повторите. Выбранное сохранено, цену обновим после загрузки.</p>
            <p style="margin: 0; color: #0F172A; font-size: 15px; font-weight: 500">{{ errServices }}</p>
            <button type="button" onClick="{{ retry }}" style="height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Повторить</button>
          </div>
        </sc-if>

        <!-- Нет подходящих мастеров -->
        <sc-if value="{{ isEmptyState }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 28px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
            <span style="width: 48px; height: 48px; border-radius: 12px; background: #F1F5F9; color: #475569; display: flex; align-items: center; justify-content: center">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="17" y1="8" x2="23" y2="14"></line><line x1="23" y1="8" x2="17" y2="14"></line></svg>
            </span>
            <h2 style="margin: 0; font-size: 22px; font-weight: 700">{{ emptyTitle }}</h2>
            <p style="margin: 0; color: #475569; font-size: 16px">{{ emptyText }}</p>
            <a href="#" style="display: inline-flex; align-items: center; height: 48px; padding: 0 20px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">{{ emptyAction }}</a>
        <sc-if value="{{ hasAction2 }}" hint-placeholder-val="{{ false }}">
          <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">{{ emptyAction2 }}</a>
        </sc-if>

          </div>
        </sc-if>

        <!-- Список мастеров -->
        <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
              <sc-if value="{{ c.isOn }}" hint-placeholder-val="{{ true }}">
                <button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 18px 24px; min-height: 104px; border-radius: 16px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #0F172A; text-align: left; cursor: pointer; font-size: 16px">
                  <span style="width: 24px; height: 24px; flex: none; border-radius: 50%; box-sizing: border-box; border: 2px solid {{c.dotBorder}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
                    <sc-if value="{{ c.pressed }}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{accent}}"></span></sc-if>
                  </span>
                  <sc-if value="{{ c.isAny }}" hint-placeholder-val="{{ false }}">
                    <span style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: {{c.tileBg}}; color: {{accent}}; display: flex; align-items: center; justify-content: center">
                      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </span>
                  </sc-if>
                  <sc-if value="{{ c.isMaster }}" hint-placeholder-val="{{ true }}">
                    <span style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #E2E8F0; color: #334155; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">{{ c.ini }}</span>
                  </sc-if>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 18px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere">{{ c.name }}</span>
                    <span style="font-size: 15px; color: #475569">{{ c.sub }}</span>
                    <sc-if value="{{ c.hasMeta }}" hint-placeholder-val="{{ true }}">
                      <span style="font-size: 15px; color: #475569">{{ c.meta }}</span>
                    </sc-if>
                  </span>
                  <sc-if value="{{ c.hasPrice }}" hint-placeholder-val="{{ true }}">
                    <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; text-align: right">
                      <span style="font-size: 18px; font-weight: 700; white-space: nowrap">{{ c.priceText }}</span>
                      <sc-if value="{{ c.hasNote }}" hint-placeholder-val="{{ false }}">
                        <span style="font-size: 14px; color: #475569">{{ c.note }}</span>
                      </sc-if>
                    </span>
                  </sc-if>
                </button>
              </sc-if>
              <!-- Мастер без свободного времени: проблему не скрываем -->
              <sc-if value="{{ c.isOff }}" hint-placeholder-val="{{ false }}">
                <div style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 18px 24px; min-height: 104px; border-radius: 16px; border: 1px dashed #CBD5E1; background: #F8FAFC">
                  <span style="width: 24px; height: 24px; flex: none"></span>
                  <span style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #E2E8F0; color: #64748B; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">{{ c.ini }}</span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 18px; line-height: 1.3; font-weight: 600; color: #475569; overflow-wrap: anywhere">{{ c.name }}</span>
                    <span style="font-size: 15px; color: #475569">{{ c.sub }}</span>
                    <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; color: #B91C1C">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                      {{ c.offText }}
                    </span>
                  </span>
                  <a href="#" style="flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Другое время</a>
                </div>
              </sc-if>
            </sc-for>
          </div>
        </sc-if>

        <!-- Мастер выбран по ссылке: повторный выбор не требуется -->
        <sc-if value="{{ isSvcStage }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 16px">
            <sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 16px; padding: 18px 24px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
              <span style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #E2E8F0; color: #334155; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">ДС</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Дамир Сарсенбаев</span>
                <span style="font-size: 15px; color: #475569">Старший барбер · принимает в этом филиале</span>
              </span>
              <a href="#" style="flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Сменить мастера</a>
            </div></sc-if>
            <div style="display: flex; flex-direction: column; gap: 12px">
              <sc-for list="{{ svcList }}" as="s" hint-placeholder-count="3">
                <button type="button" onClick="{{ s.pick }}" aria-pressed="{{ s.pressed }}" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 18px 24px; min-height: 88px; border-radius: 16px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: #0F172A; text-align: left; cursor: pointer; font-size: 16px">
                  <span style="width: 24px; height: 24px; flex: none; border-radius: 6px; box-sizing: border-box; border: 2px solid {{s.boxBorder}}; background: {{s.boxBg}}; display: flex; align-items: center; justify-content: center">
                    <sc-if value="{{ s.pressed }}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </sc-if>
                  </span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 18px; font-weight: 600">{{ s.name }}</span>
                    <span style="font-size: 15px; color: #475569">{{ s.meta }}</span>
                  </span>
                  <span style="font-size: 18px; font-weight: 700; white-space: nowrap">{{ s.priceText }}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        
        <sc-if value="{{ hasAlt }}" hint-placeholder-val="{{ false }}">
          <a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Предпочитаю сначала выбрать мастера</a>
        </sc-if>
        <p style="margin: 0; color: #64748B; font-size: 14px">Имена, цены, длительность и доступность демонстрационные. В продукте они считаются для выбранных услуг и филиала.</p>
      </section>

      <!-- Сводка: только достоверно известное -->
      <aside style="flex: 1 1 320px; max-width: 100%; min-width: 0; position: sticky; top: 24px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">Ваша запись</h2>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 16px">
          <span style="min-width: 0"><span style="color: #64748B">Филиал: </span><span style="font-weight: 500">{{ branch }}</span></span>
          <button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">Сменить</button>
        </div>

        <div style="height: 1px; background: #E2E8F0"></div>

        <div style="display: flex; flex-direction: column; gap: 10px; font-size: 16px">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
              <span><span style="color: #64748B">{{ r.label }}: </span><span style="color: #0F172A; font-weight: {{r.weight}}">{{ r.value }}</span><sc-if value="{{ r.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="margin-left: 8px; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; background: {{r.badgeBg}}; color: {{r.badgeFg}}">{{ r.badge }}</span></sc-if></span>
              <sc-if value="{{ r.hasAction }}" hint-placeholder-val="{{ false }}">
                <a href="#" style="flex: none; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Изменить</a>
              </sc-if>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ hasBd }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <button type="button" onClick="{{ bdToggle }}" aria-expanded="{{ bdOpen }}" style="align-self: flex-start; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">Состав стоимости</button>
            <sc-if value="{{ bdOpen }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0; font-size: 15px">
                <sc-for list="{{ bdRows }}" as="b" hint-placeholder-count="3">
                  <div style="display: flex; justify-content: space-between; gap: 12px; color: #475569"><span>{{ b.name }}</span><span style="white-space: nowrap; color: #0F172A">{{ b.price }}</span></div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <button type="button" onClick="{{ ctaGo }}" disabled="{{ ctaOff }}" style="height: 56px; border: 0; border-radius: 12px; background: {{ctaBg}}; color: {{ctaColor}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: {{ctaCursor}}">
          {{ ctaLabel }}
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </aside>
    </div>
  </main>
</div>
</script>
<script type="text/x-template" id="tpl-mobile">
<div style="width: {{ rootW }}px; height: 844px; box-sizing: border-box; background: #F8FAFC; color: #0F172A; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <!-- Компактная шапка -->
  <header style="background: #FFFFFF; padding: 4px 16px; display: flex; align-items: center; gap: 10px">
    <a href="#" onClick="{{ back }}" aria-label="Назад" style="width: 44px; height: 44px; flex: none; box-sizing: border-box; border: 1px solid #CBD5E1; border-radius: 10px; color: #0F172A; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 16px; line-height: 1.3; font-weight: 700; letter-spacing: 0.05em">BARBER HOUSE</span>
    </div>
    <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="Контакты и маршрут" style="width: 44px; height: 44px; flex: none; border: 1px solid #CBD5E1; border-radius: 10px; background: #FFFFFF; color: #0F172A; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
  </header>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; right: 16px; top: 50px; z-index: 5; width: 230px; padding: 6px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 8px 24px rgba(15,23,42,0.14)">
      <span style="padding: 8px 12px 2px; font-size: 13px; color: #64748B">{{ branch }}</span>
      <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 16px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
        Построить маршрут
      </a>

  <!-- Компактный прогресс -->

        <a href="{{ k.href }}" style="flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Изменить</a>

    <sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}">

    <sc-if value="{{ hasBanner }}" hint-placeholder-val="{{ false }}">

        <sc-if value="{{ bn.hasAction }}" hint-placeholder-val="{{ false }}">

    <!-- Загрузка -->

            <div style="width: 24px; height: 24px; border-radius: 50%; background: #E2E8F0"></div>
            <div style="width: 48px; height: 48px; border-radius: 50%; background: #E2E8F0"></div>

              <div style="width: 40%; height: 12px; border-radius: 6px; background: #E2E8F0"></div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 20px; border-radius: 14px; background: #FFFFFF; border: 1px solid #FCA5A5">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #FEF2F2; color: #B91C1C; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l22 22"></path><path d="M16.7 11.1A11 11 0 0 1 21 13.5"></path><path d="M5 12.6a11 11 0 0 1 5.2-2.5"></path><path d="M8.5 16.4a6 6 0 0 1 7 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        </span>
        <h2 style="margin: 0; font-size: 20px; line-height: 1.3; font-weight: 700">{{ errTitle }}</h2>
        <p style="margin: 0; color: #475569; font-size: 15px">Проверьте соединение и повторите. Выбранное сохранено, цену обновим после загрузки.</p>

        <button type="button" onClick="{{ retry }}" style="height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Повторить</button>

    <!-- Нет подходящих мастеров -->

        <span style="width: 44px; height: 44px; border-radius: 12px; background: #F1F5F9; color: #475569; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="17" y1="8" x2="23" y2="14"></line><line x1="23" y1="8" x2="17" y2="14"></line></svg>

              <sc-if value="{{ c.isAny }}" hint-placeholder-val="{{ false }}">

                </span>
              </sc-if>
              <sc-if value="{{ c.isMaster }}" hint-placeholder-val="{{ true }}">
                <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: #E2E8F0; color: #334155; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{ c.ini }}</span>
              </sc-if>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">

                <sc-if value="{{ c.hasPrice }}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 14px; line-height: 1.35; color: #475569"><span style="font-size: 16px; font-weight: 700; color: #0F172A; white-space: nowrap">{{ c.priceText }}</span> {{ c.tail }}</span>
                </sc-if>
              </span>
            </button>
          </sc-if>
          <sc-if value="{{ c.isOff }}" hint-placeholder-val="{{ false }}">
            <div style="width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1px dashed #CBD5E1; background: #F8FAFC">
              <span style="width: 24px; height: 24px; flex: none"></span>
              <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: #E2E8F0; color: #64748B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{ c.ini }}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 16px; line-height: 1.3; font-weight: 600; color: #475569; overflow-wrap: anywhere">{{ c.name }}</span>
                <span style="font-size: 14px; line-height: 1.35; color: #475569">{{ c.sub }}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 1.35; font-weight: 500; color: #B91C1C">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                  {{ c.offText }}
                </span>
                <a href="#" style="align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Другое время</a>
              </span>
            </div>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>

    <!-- Мастер выбран по ссылке -->
    <sc-if value="{{ isSvcStage }}" hint-placeholder-val="{{ false }}">

        <sc-for list="{{ svcList }}" as="s" hint-placeholder-count="3">

            <span style="width: 24px; height: 24px; flex: none; border-radius: 6px; box-sizing: border-box; border: 2px solid {{s.boxBorder}}; background: {{s.boxBg}}; display: flex; align-items: center; justify-content: center">

                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 17px; font-weight: 600; line-height: 1.3">{{ s.name }}</span>
              <span style="font-size: 14px; color: #475569"><span style="font-size: 16px; font-weight: 700; color: #0F172A; white-space: nowrap">{{ s.priceText }}</span> · {{ s.meta }}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    
        <sc-if value="{{ hasAlt }}" hint-placeholder-val="{{ false }}">
          <a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Предпочитаю сначала выбрать мастера</a>
        </sc-if>
    <p style="margin: 0; color: #64748B; font-size: 14px">Имена, цены, длительность и доступность демонстрационные.</p>
  </main>

  <!-- Расшифровка суммы -->
  <sc-if value="{{ bdOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 12px; right: 12px; bottom: 92px; z-index: 4; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 8px 24px rgba(15,23,42,0.14); font-size: 15px">

        <div style="display: flex; justify-content: space-between; gap: 12px; color: #475569"><span>{{ b.name }}</span><span style="white-space: nowrap; color: #0F172A">{{ b.price }}</span></div>

    </div>

  <!-- Фиксированная нижняя панель -->
  <div style="background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 8px 16px 12px; display: flex; align-items: center; gap: 16px">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 16px; line-height: 1.3; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ barTitle }}</span>
      <span style="color: #475569; font-size: 14px; line-height: 1.35">{{ barSub }}</span>
    </div>
    <sc-if value="{{ hasBd }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ bdToggle }}" aria-expanded="{{ bdOpen }}" style="flex: none; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">Состав</button>

    <button type="button" onClick="{{ ctaGo }}" disabled="{{ ctaOff }}" style="flex: none; min-width: 112px; height: 52px; padding: 0 18px; white-space: nowrap; border: 0; border-radius: 12px; background: {{ctaBg}}; color: {{ctaColor}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: {{ctaCursor}}">
      {{ ctaLabel }}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </button>
  </div>
</div>
</script>
<script type="text/x-template" id="tpl-cal-desktop">

            </a>
            <a class="menu-link" href="#" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 16px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
              Позвонить
            </a>
          </div>
        </sc-if>
      </div>
    </div>
  </header>

    <main style="width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <!-- Шаги записи: порядок зависит от того, с чего начал клиент -->
    <nav aria-label="Шаги записи">
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 16px">
        <sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
          <li aria-current="{{ st.aria }}" style="display: flex; align-items: center; gap: 10px; color: {{st.labelColor}}">
            <span style="width: 30px; height: 30px; border-radius: 50%; background: {{st.bg}}; color: {{st.fg}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{ st.done }}" hint-placeholder-val="{{ false }}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
              <sc-if value="{{ st.pref }}" hint-placeholder-val="{{ false }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
              </sc-if>
              <sc-if value="{{ st.showNum }}" hint-placeholder-val="{{ true }}">{{ st.n }}</sc-if>
            </span>
            <span style="font-weight: {{st.weight}}">{{ st.label }}</span>
            <sc-if value="{{ st.notLast }}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="display: inline-block; width: 28px; height: 2px; margin-left: 2px; background: #E2E8F0"></span>
            </sc-if>
          </li>
        </sc-for>
      </ol>
    </nav>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

      <section style="flex: 999 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <a href="#" onClick="{{ back }}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: -8px; color: #475569; text-decoration: none; font-size: 15px; font-weight: 500">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          {{ backLabel }}
        </a>
        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: -12px">
          <h1 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700">{{ title }}</h1>
          <p style="margin: 0; color: #475569; font-size: 16px">{{ subtitle }}</p>
        </div>

        <sc-if value="{{ hasCtx }}" hint-placeholder-val="{{ true }}">
        <!-- Контекст: мастер и услуги -->
        <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 20px">
            <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: #E2E8F0; color: #334155; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{ who.ini }}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 17px; font-weight: 600; overflow-wrap: anywhere">{{ who.title }}</span>
              <span style="font-size: 14px; color: #475569">{{ who.sub }}</span>
            </span>
            <a href="#" style="flex: none; min-height: 44px; display: inline-flex; align-items: center; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Сменить</a>
          </div>
          <div style="height: 1px; background: #E2E8F0"></div>
          <div style="display: flex; align-items: center; gap: 16px; padding: 10px 20px">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 16px; font-weight: 600; overflow-wrap: anywhere">{{ ctx.title }}</span>
              <span style="font-size: 14px; color: #475569; overflow-wrap: anywhere">{{ ctx.sub }}</span>
            </span>
            <sc-if value="{{ ctx.hasToggle }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ ctx.toggle }}" style="flex: none; min-height: 44px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">{{ ctx.toggleLabel }}</button></sc-if>
            <a href="#" style="flex: none; min-height: 44px; display: inline-flex; align-items: center; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Изменить</a>
          </div>
        </div>
        </sc-if>

        <sc-if value="{{ hasBanner }}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 14px; background: {{bn.bg}}; border: 1px solid {{bn.border}}; color: {{bn.fg}}">
            <span style="font-size: 16px; line-height: 1.3; font-weight: 700">{{ bn.title }}</span>
            <span style="font-size: 15px; line-height: 1.4">{{ bn.text }}</span>
            <sc-if value="{{ bn.hasChips }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{ bn.chips }}" as="ch" hint-placeholder-count="2">
                  <button type="button" onClick="{{ ch.pick }}" style="min-height: 44px; min-width: 72px; padding: 0 16px; border-radius: 10px; border: 1px solid {{bn.border}}; background: #FFFFFF; color: #0F172A; font-size: 16px; font-weight: 600; cursor: pointer">{{ ch.label }}</button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ bn.hasAction }}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{ bn.onAction }}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: {{bn.btnBg}}; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">{{ bn.action }}</button>
            </sc-if>
          </div>
        </sc-if>

        <!-- Календарь -->
        <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <div style="display: flex; align-items: center; gap: 8px">
            <h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 700">{{ monthLabel }}</h2>
            <button type="button" onClick="{{ toggleMonth }}" aria-expanded="{{ monthOpen }}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-size: 15px; font-weight: 600; cursor: pointer">{{ monthBtn }}</button>
          </div>
          <div style="display: flex; align-items: stretch; gap: 8px">
            <sc-if value="{{ canPrev }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ prevWeek }}" aria-label="Предыдущая неделя" style="flex: none; width: 44px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button></sc-if>
            <div style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
                <button type="button" onClick="{{ d.pick }}" aria-pressed="{{ d.sel }}" aria-label="{{ d.aria }}" style="min-height: 84px; padding: 8px 4px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer">
                  <span style="font-size: 14px">{{ d.dow }}</span>
                  <span style="font-size: 22px; font-weight: 700; line-height: 1.2">{{ d.num }}</span>
                  <span style="font-size: 12px; line-height: 1.2; color: {{d.subFg}}">{{ d.sub }}</span>
                </button>
              </sc-for>
            </div>
            <sc-if value="{{ canNext }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ nextWeek }}" aria-label="Следующая неделя" style="flex: none; width: 44px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button></sc-if>
          </div>
          <sc-if value="{{ monthOpen }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0">
              <div style="display: flex; align-items: center; justify-content: space-between">
                <button type="button" onClick="{{ prevMonth }}" disabled="{{ canPrevM }}" aria-label="Предыдущий месяц" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">‹ Ноябрь</button>
                <b style="font-size: 16px">{{ gridLabel }}</b>
                <button type="button" onClick="{{ nextMonth }}" disabled="{{ canNextM }}" aria-label="Следующий месяц" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">Декабрь ›</button>
              </div>
              <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
                <sc-for list="{{ dowHeads }}" as="h" hint-placeholder-count="7"><span style="font-size: 13px; color: #64748B">{{ h }}</span></sc-for>
                <sc-for list="{{ gridCells }}" as="c" hint-placeholder-count="30">
                  <sc-if value="{{ c.blank }}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
                  <sc-if value="{{ c.notBlank }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ c.pick }}" disabled="{{ c.disabled }}" aria-pressed="{{ c.sel }}" aria-label="{{ c.aria }}" style="min-height: 44px; border-radius: 10px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: {{c.weight}}; cursor: pointer">{{ c.num }}</button></sc-if>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>

        <!-- Интервалы и состояния -->
        <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{ groupsTitle }}<span style="font-weight: 500; color: #475569"> · {{ dayTitle }}</span></h2>
          <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px" aria-busy="true">
              <sc-for list="{{ skel }}" as="k" hint-placeholder-count="8"><div class="sk" style="height: 52px; border-radius: 12px; background: #E2E8F0"></div></sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
            <div role="alert" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 20px; border-radius: 12px; background: #FEF2F2; border: 1px solid #FCA5A5; color: #7F1D1D">
              <b style="font-size: 18px">{{ errTitle }}</b>
              <span style="font-size: 15px">{{ errText }}</span>
              <button type="button" onClick="{{ retry }}" style="height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Повторить</button>
            </div>
          </sc-if>
          <sc-if value="{{ isNone }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 20px; border-radius: 12px; background: #F8FAFC; border: 1px dashed #CBD5E1">
              <b style="font-size: 18px">{{ noneTitle }}</b>
              <span style="font-size: 15px; color: #475569">{{ noneText }}</span>
              <sc-if value="{{ hasNear }}" hint-placeholder-val="{{ true }}">
                <span style="display: flex; flex-wrap: wrap; gap: 8px">
                  <sc-for list="{{ nearChips }}" as="ch" hint-placeholder-count="2"><button type="button" onClick="{{ ch.pick }}" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-size: 16px; font-weight: 600; cursor: pointer">{{ ch.label }}</button></sc-for>
                </span>
                <button type="button" onClick="{{ nearPick }}" style="min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">{{ nearBtn }}</button>
              </sc-if>
              <sc-if value="{{ noNear }}" hint-placeholder-val="{{ false }}">
                <span style="display: flex; flex-wrap: wrap; gap: 10px">
                  <button type="button" style="min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">{{ noneAction }}</button>
                  <button type="button" onClick="{{ nextMonth }}" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-size: 16px; font-weight: 600; cursor: pointer">Посмотреть декабрь</button>
                </span>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ isClosed }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 20px; border-radius: 12px; background: #F8FAFC; border: 1px dashed #CBD5E1">
              <b style="font-size: 18px">{{ closedTitle }}</b>
              <span style="font-size: 15px; color: #475569">{{ closedText }}</span>
              <span style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{ closedChips }}" as="ch" hint-placeholder-count="2"><button type="button" onClick="{{ ch.pick }}" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-size: 16px; font-weight: 600; cursor: pointer">{{ ch.label }}</button></sc-for>
              </span>
            </div>
          </sc-if>
          <sc-if value="{{ isSlots }}" hint-placeholder-val="{{ true }}">
            <sc-if value="{{ isTime }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #475569">{{ timeNote }}</span></sc-if>
            <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 8px">
                <span style="font-size: 14px; font-weight: 600; color: #64748B; text-transform: uppercase; letter-spacing: 0.04em">{{ g.name }}</span>
                <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
                  <sc-for list="{{ g.items }}" as="t" hint-placeholder-count="4">
                    <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="min-height: 52px; padding: 0 8px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 17px; font-weight: 600; cursor: pointer">{{ t.t }}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </sc-if>
        </div>

        <!-- Мастера на выбранное время -->
        <sc-if value="{{ hasOffer }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px">
              <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{ offerTitle }}</h2>
              <span style="font-size: 14px; color: #475569">{{ offerCount }}</span>
            </div>
            <sc-for list="{{ offer }}" as="o" hint-placeholder-count="2">
              <button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 14px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: #0F172A; text-align: left; font: inherit; cursor: pointer">
                <span style="width: 22px; height: 22px; flex: none; border-radius: 50%; box-sizing: border-box; border: 2px solid {{o.dot}}; background: {{o.dotBg}}; box-shadow: inset 0 0 0 3px #FFFFFF"></span>
                <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: {{o.tile}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{ o.ini }}</span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                  <span style="font-size: 17px; font-weight: 600; overflow-wrap: anywhere">{{ o.name }}</span>
                  <span style="font-size: 14px; color: #475569">{{ o.range }}</span>
                  <sc-if value="{{ o.best }}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; margin-top: 2px; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #DCFCE7; color: #166534">Предлагаем первым: ниже цена</span></sc-if>
                </span>
                <span style="flex: none; font-size: 18px; font-weight: 700; white-space: nowrap">{{ o.price }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <p style="margin: 0; color: #64748B; font-size: 14px">Даты, интервалы и доступность демонстрационные. В продукте они считаются для выбранных услуг, мастера и часового пояса филиала. Окончательная проверка при оформлении записи.</p>
      </section>

      <!-- Сводка: только достоверно известное -->
      <aside style="flex: 1 1 320px; max-width: 100%; min-width: 0; position: sticky; top: 24px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">Ваша запись</h2>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 16px">
          <span style="min-width: 0"><span style="color: #64748B">Филиал: </span><span style="font-weight: 500">{{ branch }}</span></span>
          <button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">Сменить</button>
        </div>

        <div style="height: 1px; background: #E2E8F0"></div>

        <div style="display: flex; flex-direction: column; gap: 10px; font-size: 16px">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
              <span><span style="color: #64748B">{{ r.label }}: </span><span style="color: #0F172A; font-weight: {{r.weight}}">{{ r.value }}</span><sc-if value="{{ r.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="margin-left: 8px; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; background: {{r.badgeBg}}; color: {{r.badgeFg}}">{{ r.badge }}</span></sc-if></span>
              <sc-if value="{{ r.hasAction }}" hint-placeholder-val="{{ false }}">
                <a href="#" style="flex: none; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none">Изменить</a>
              </sc-if>
            </div>
          </sc-for>
        </div>

        <button type="button" onClick="{{ ctaGo }}" disabled="{{ ctaOff }}" style="height: 56px; border: 0; border-radius: 12px; background: {{ctaBg}}; color: {{ctaColor}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: {{ctaCursor}}">
          {{ ctaLabel }}
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </aside>
    </div>
  </main>
</div>
</script>
<script type="text/x-template" id="tpl-cal-mobile">
<div style="width: {{ rootW }}px; height: 844px; box-sizing: border-box; background: #F8FAFC; color: #0F172A; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <!-- Компактная шапка -->
  <header style="background: #FFFFFF; padding: 4px 16px; display: flex; align-items: center; gap: 10px">
    <a href="#" onClick="{{ back }}" aria-label="Назад" style="width: 44px; height: 44px; flex: none; box-sizing: border-box; border: 1px solid #CBD5E1; border-radius: 10px; color: #0F172A; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 16px; line-height: 1.3; font-weight: 700; letter-spacing: 0.05em">BARBER HOUSE</span>
    </div>

        <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" style="height: 48px; padding: 0 18px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; border: 1px solid #CBD5E1; border-radius: 10px; background: #FFFFFF; color: #0F172A; font-size: 16px; font-weight: 500; cursor: pointer">
