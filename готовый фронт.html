<script>
/* Мини-движок шаблонов: sc-if, sc-for, {{ путь }} поверх renderVals() компонента */
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; this._r = null; }
  setState(p) { Object.assign(this.state, p); if (this._r) this._r(); }
}
class BookingLogic extends DCLogic {
  constructor(props) {
    super(props);
    const ev = props.event || 'none';
    const sel0 = { 'master-changed': 'alex', 'service-changed': 'damir', 'slot-taken': 'damir', 'price-changed': 'damir' }[ev] || (props.reason === 'noslots' && props.view === 'no-masters' ? 'damir' : 'any');
    this.state = { sel: sel0, menu: false, link: [], pick: [], slot: null, ack: false, retry: 'idle', bd: null, svcOpen: false };
  }
  fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0₸'; }
  dur(m) {
    if (m < 60) return m + ' мин';
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + ' ч ' + r + ' мин' : h + ' ч';
  }
  clock(total) {
    const h = Math.floor(total / 60), m = total % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  verify(t) { this.setState({ vslot: t }); clearTimeout(this._v); this._v = setTimeout(() => this.setState({ slot: t, vslot: null }), 900); }
  renderVals() {
    const v = this.renderVals0(), slot = this.props.slot, dt = this.props.dateTxt;
    if (dt && dt !== '9 ноября') { const re9 = (o) => { for (const k of Object.keys(o)) { const x = o[k]; if (typeof x === 'string') o[k] = x.split('9 ноября').join(dt); else if (x && typeof x === 'object') re9(x); } }; re9(v); }
    if (slot && slot !== '18:00') {
      const re = (o) => { for (const k of Object.keys(o)) { const x = o[k]; if (typeof x === 'string') o[k] = x.split('18:00').join(slot); else if (x && typeof x === 'object') re(x); } };
      re(v);
    }
    return v;
  }
  renderVals0() {
    const P = this.props, S = this.state;
    const accent = P.accent ?? '#2563EB';
    const sc = P.scenario ?? 'service-first';
    const st = P.view ?? 'normal';
    const sv = P.services ?? 'one';
    const ev = P.event ?? 'none';
    const reason = P.reason || (sc === 'master-link' ? 'badlink' : 'services');
    const soft = accent + '0F', tile = accent + '1A';
    const isLinkSc = sc === 'master-link', isTF = sc === 'time-first', isST = sc === 'service-time';
    const hasService = sc === 'service-first' || isST;
    const many = sv === 'many';
    const plural = (n, a, b, c) => ((n % 10 === 1 && n % 100 !== 11) ? a : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? b : c));
    const linkBroken = isLinkSc && st === 'no-masters';
    const branch = ev === 'branch-changed' ? 'Астана · Нурлы жол' : 'Астана · Пример барбершопа';

    // Данные демонстрационные: у каждого мастера свои цена и длительность по каждой услуге
    const svcNames = { cut: 'Мужская стрижка', beard: 'Оформление бороды', combo: 'Стрижка + борода', wash: 'Мытьё головы', style: 'Укладка', mask: 'Маска для лица' };
    if (many && (isLinkSc || isTF)) {
      svcNames.cut = 'Классическая мужская стрижка машинкой и ножницами'; svcNames.beard = 'Оформление и моделирование бороды с уходом'; svcNames.combo = 'Комплекс: стрижка, борода и укладка'; svcNames.wash = 'Мытьё головы с массажем'; svcNames.style = 'Профессиональная укладка с фиксацией';
    }
    let masters = [
      { id: 'alex', name: 'Александр Ким', role: 'Барбер', ini: 'АК', p: { cut: [6000, 45], beard: [3500, 25], combo: [8500, 70], wash: [1500, 10], style: [2500, 15], mask: [2000, 15] }, free: false },
      { id: 'damir', name: 'Дамир Сарсенбаев', role: 'Старший барбер', ini: 'ДС', p: { cut: [8000, 50], beard: [4000, 30], combo: [11000, 80], wash: [2000, 10], style: [3000, 15], mask: [2500, 20] }, free: true },
      { id: 'ruslan', name: 'Руслан Бекмухамбетов', role: 'Топ-барбер', ini: 'РБ', p: { cut: [10000, 60], beard: [5000, 35], combo: [13500, 90], wash: [2500, 15], style: [3500, 20], mask: [3000, 20] }, free: true }
    ];
    if (many) {
      masters[2].name = 'Руслан Бекмухамбетов-Нурмагамбетов';
      masters[2].role = 'Ведущий барбер-стилист, наставник команды';
    }
    if (ev === 'branch-changed') masters = masters.filter((m) => m.id !== 'damir');
    const svcIds = sv === 'two' ? ['cut', 'beard'] : (many ? ['cut', 'beard', 'wash', 'style', 'mask'] : ['cut']);
    const bump = ev === 'price-changed' ? 1000 : 0;
    const sumFor = (m) => {
      const t = svcIds.reduce((a, id) => [a[0] + m.p[id][0], a[1] + m.p[id][1]], [0, 0]);
      if (m.id === 'damir') t[0] += bump;
      return t;
    };

    // Состав услуг: пересекающиеся услуги нельзя выбрать вместе
    const parts = { cut: ['haircut'], beard: ['beard'], combo: ['haircut', 'beard'], wash: ['wash'], style: ['style'], mask: ['mask'] };
    const overlap = (a, b) => parts[a].some((x) => parts[b].includes(x));
    const toggle = (key, id) => {
      const cur = S[key];
      if (cur.includes(id)) { this.setState({ [key]: cur.filter((x) => x !== id) }); return; }
      this.setState({ [key]: cur.filter((x) => !overlap(x, id)).concat(id) });
    };
    const dm = masters.find((m) => m.id === 'damir') || { p: { cut: [8000, 50], beard: [4000, 30], combo: [11000, 80] } };
    const lsel = S.link, psel = S.pick;
    const mkSvc = (id, key, priceText, meta) => {
      const on = S[key].includes(id);
      return {
        name: svcNames[id], meta, priceText, pressed: on,
        border: on ? accent : '#E2E8F0', bg: on ? soft : '#FFFFFF',
        boxBorder: on ? accent : '#64748B', boxBg: on ? accent : '#FFFFFF',
        pick: () => toggle(key, id)
      };
    };
    const linkServices = ['cut', 'beard', 'combo'].map((id) => mkSvc(id, 'link', this.fmt(dm.p[id][0]), this.dur(dm.p[id][1])));
    const minOf = (id) => [Math.min.apply(null, masters.map((m) => m.p[id][0])), Math.min.apply(null, masters.map((m) => m.p[id][1]))];
    const pickServices = ['cut', 'beard', 'combo', 'wash', 'style'].map((id) => mkSvc(id, 'pick', 'от ' + this.fmt(minOf(id)[0]), 'от ' + this.dur(minOf(id)[1])));
    const linkTotal = lsel.reduce((a, id) => [a[0] + dm.p[id][0], a[1] + dm.p[id][1]], [0, 0]);
    const pickMin = psel.reduce((a, id) => [a[0] + minOf(id)[0], a[1] + minOf(id)[1]], [0, 0]);

    // Время: предпочтение, проверенный интервал, подтверждённая запись
    const BADGE = {
      pref: { t: 'Предпочтение', bg: '#FEF3C7', fg: '#92400E' },
      chk: { t: 'Проверено', bg: '#DBEAFE', fg: '#1E40AF' },
      ok: { t: 'Подтверждено', bg: '#DCFCE7', fg: '#166534' }
    };
    const timeEv = ev === 'master-changed' || ev === 'service-changed';
    let kind = null;
    if (isTF) kind = 'pref';
    else if (timeEv) kind = S.slot ? 'chk' : 'pref';
    else if (isST) kind = (ev === 'slot-taken' && !S.slot) ? 'pref' : 'chk';
    const freeN = masters.filter((m) => m.free).length;
    const stAny = isST && ev === 'none' && (S.sel === 'any' || !masters.find((m) => m.id === S.sel));
    const slotTxt = S.slot || '18:00';
    const slotMin = parseInt(slotTxt.slice(0, 2), 10) * 60 + parseInt(slotTxt.slice(3), 10);
    const showRange = isST && !(ev === 'slot-taken' && !S.slot);
    let tb = {}, hasTimeBox = false, timeVal = 'не выбрано', timeBadge = null;
